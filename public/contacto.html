<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%220,0 100,20 80,100 20,80%22 fill=%22%23ff4655%22/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // RECRUITMENT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap');

        body { 
            background-color: #0f1923; 
            color: #ece8e1; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-image: linear-gradient(rgba(15,25,35,0.9), rgba(15,25,35,0.9)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,70,85,0.03) 2px, rgba(255,70,85,0.03) 4px);
        }

        nav { 
            background: #111822; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            border-bottom: 3px solid #ff4655; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        nav a { 
            color: #ece8e1; 
            text-decoration: none; 
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase; 
            transition: 0.2s; 
        }

        nav a:hover, nav a.active { 
            color: #ff4655; 
            text-shadow: 0 0 10px rgba(255,70,85,0.6); 
        }

        .container { 
            padding: 50px 20px; 
            text-align: center; 
            max-width: 500px; 
            margin: 0 auto; 
        }

        h2 { 
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            color: #ece8e1; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 5px;
        }

        h2 span { color: #ff4655; }

        .form-box {
            background: #1f2326;
            border-left: 4px solid #ff4655;
            padding: 30px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            text-align: left;
            margin-top: 25px;
        }

        input, textarea { 
            width: 100%; 
            background: #0f1923; 
            border: 1px solid #383e45; 
            padding: 12px; 
            margin-bottom: 15px; 
            color: #fff; 
            font-family: inherit; 
            box-sizing: border-box; 
        }

        input:focus, textarea:focus { 
            border-color: #ff4655; 
            outline: none; 
            box-shadow: 0 0 8px rgba(255,70,85,0.4); 
        }

        .btn-val { 
            background: #ff4655; 
            color: #ece8e1; 
            border: none; 
            padding: 12px; 
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            width: 100%; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: 0.2s; 
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
        }

        .btn-val:hover { 
            background: #fa4454; 
            box-shadow: 0 0 15px #ff4655; 
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Cuartel General</a>
        <a href="valorant.html">Meta & Agentes</a>
        <a href="contacto.html" class="active">Reclutamiento / Clips</a>
    </nav>

    <div class="container">
        <h2>CENTRO DE <span>RECLUTAMIENTO</span></h2>
        <p style="color: #8393a7; text-transform: uppercase; font-size: 0.85rem;">Postúlate para unirte a equipos de la comunidad o envía tus mejores jugadas.</p>
        
        <div class="form-box">
            <form onsubmit="event.preventDefault(); alert('[TRANSMISIÓN EXITOSA] Tu solicitud ha sido enviada al cuartel central de Nexus.');">
                <label style="font-size: 0.8rem; color: #ff4655; font-weight: bold; text-transform: uppercase;">Riot ID + Tag</label>
                <input type="text" placeholder="Ej. Player#EUW" required style="margin-top: 5px;">
                
                <label style="font-size: 0.8rem; color: #ff4655; font-weight: bold; text-transform: uppercase;">Enlace de Clip o Discord</label>
                <input type="url" placeholder="https://..." required style="margin-top: 5px;">
                
                <label style="font-size: 0.8rem; color: #ff4655; font-weight: bold; text-transform: uppercase;">Mensaje Táctico</label>
                <textarea rows="4" placeholder="Busco dueto para subir a Immortal..." required style="margin-top: 5px;"></textarea>
                
                <button type="submit" class="btn-val">Enviar Solicitud</button>
            </form>
        </div>
    </div>

</body>
</html>
