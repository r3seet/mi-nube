<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Logo NEXUS estilo Valorant -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2210,0 90,0 100,20 100,90 90,100 0,100 0,10%22 fill=%22%230f1923%22 stroke=%22%23ff4655%22 stroke-width=%224%22/><path d=%22M28 75V25l44 50V25%22 fill=%22none%22 stroke=%22%23ff4655%22 stroke-width=%2214%22 stroke-linecap=%22square%22 stroke-linejoin=%22miter%22/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // RECLUTAMIENTO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap');

        body { 
            background-color: #0f1923; 
            color: #ece8e1; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-image: linear-gradient(rgba(15,25,35,0.9), rgba(15,25,35,0.9)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,70,85,0.03) 2px, rgba(255,70,85,0.03) 4px);
        }

        nav { 
            background: #111822; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            border-bottom: 3px solid #ff4655; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        nav a { 
            color: #ece8e1; 
            text-decoration: none; 
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase; 
            transition: 0.2s; 
        }

        nav a:hover, nav a.active { 
            color: #ff4655; 
            text-shadow: 0 0 10px rgba(255,70,85,0.6); 
        }

        .container { 
            max-width: 600px; 
            margin: 40px auto; 
            padding: 0 20px; 
            text-align: center; 
        }

        h2 { 
            font-family: 'Teko', sans-serif;
            font-size: 3.5rem;
            color: #ece8e1; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 5px;
        }

        h2 span { color: #ff4655; text-shadow: 0 0 15px rgba(255,70,85,0.6); }

        .form-box {
            background: #1f2326;
            border-top: 3px solid #ff4655;
            padding: 30px;
            text-align: left;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-top: 25px;
        }

        label {
            font-family: 'Teko', sans-serif;
            font-size: 1.3rem;
            color: #ece8e1;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input, textarea {
            width: 100%;
            background: #111822;
            border: 1px solid #383e45;
            padding: 12px;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: #ff4655;
        }

        .btn-val { 
            background: transparent; 
            color: #ece8e1; 
            border: 1px solid #ff4655; 
            padding: 12px; 
            width: 100%; 
            cursor: pointer; 
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase; 
            transition: 0.2s; 
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
        }

        .btn-val:hover { 
            background: #ff4655; 
            color: #fff; 
            box-shadow: 0 0 15px #ff4655; 
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Cuartel General</a>
        <a href="valorant.html">Meta & Agentes</a>
        <a href="contacto.html" class="active">Reclutamiento / Clips</a>
    </nav>

    <div class="container">
        <h2>CENTRO DE <span>RECLUTAMIENTO</span></h2>
        <p style="color: #8393a7; text-transform: uppercase; font-size: 0.9rem;">Envía tu postulación o comparte tus mejores jugadas.</p>

        <div class="form-box">
            <form onsubmit="enviarFormulario(event)">
                <label for="nombre">Nombre de Jugador (Riot ID)</label>
                <input type="text" id="nombre" placeholder="Ej. Nexus #1337" required>

                <label for="clip">Enlace de Clip / Discord</label>
                <input type="text" id="clip" placeholder="https://youtube.com/... o tu usuario" required>

                <label for="mensaje">Mensaje / Rango Actual</label>
                <textarea id="mensaje" rows="4" placeholder="Indica tu rango competitivo o detalles..." required></textarea>

                <button type="submit" class="btn-val">Enviar Postulación</button>
            </form>
        </div>
    </div>

    <script>
        function enviarFormulario(e) {
            e.preventDefault();
            alert("[TRANSMISIÓN EXITOSA] Tu solicitud ha sido enviada al cuartel general de Nexus.");
            document.querySelector('form').reset();
        }
    </script>
</body>
</html>
