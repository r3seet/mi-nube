<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Logo NEXUS estilo Valorant -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2210,0 90,0 100,20 100,90 90,100 0,100 0,10%22 fill=%22%230f1923%22 stroke=%22%23ff4655%22 stroke-width=%224%22/><path d=%22M28 75V25l44 50V25%22 fill=%22none%22 stroke=%22%23ff4655%22 stroke-width=%2214%22 stroke-linecap=%22square%22 stroke-linejoin=%22miter%22/></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // CUARTEL GENERAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap');

        body { 
            background-color: #0f1923; 
            color: #ece8e1; 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
            background-image: linear-gradient(rgba(15,25,35,0.9), rgba(15,25,35,0.9)), repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,70,85,0.03) 2px, rgba(255,70,85,0.03) 4px);
            animation: fadeInBody 0.8s ease-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Líneas de fondo animadas (Radar / Grid) */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 70, 85, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            opacity: 0.4;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        nav { 
            background: #111822; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: center; 
            gap: 40px; 
            border-bottom: 3px solid #ff4655; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        nav a { 
            color: #ece8e1; 
            text-decoration: none; 
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase; 
            transition: 0.3s; 
        }

        nav a:hover, nav a.active { 
            color: #ff4655; 
            text-shadow: 0 0 12px rgba(255,70,85,0.8); 
        }

        .container { 
            max-width: 900px; 
            margin: 40px auto; 
            padding: 0 20px; 
            text-align: center; 
            position: relative;
            z-index: 2;
        }

        /* Contenedor del Spike Animado Estilo Valorant */
        .spike-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatSpike 3s ease-in-out infinite;
        }

        @keyframes floatSpike {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        /* Círculo de energía del Spike */
        .spike-aura {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed #ff4655;
            border-radius: 50%;
            animation: rotateAura 8s linear infinite;
        }

        @keyframes rotateAura {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Estilo visual del Spike en SVG */
        .spike-icon {
            width: 50px;
            height: 50px;
            fill: #ff4655;
            filter: drop-shadow(0 0 10px rgba(255, 70, 85, 0.8));
            animation: pulseSpike 1.5s infinite alternate;
        }

        @keyframes pulseSpike {
            0% { filter: drop-shadow(0 0 5px rgba(255, 70, 85, 0.5)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 18px rgba(255, 70, 85, 1)); transform: scale(1.08); }
        }

        h1 { 
            font-family: 'Teko', sans-serif;
            font-size: 4.5rem;
            color: #ece8e1; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 10px;
            line-height: 1;
            animation: pulseTitle 3s infinite alternate;
        }

        @keyframes pulseTitle {
            0% { text-shadow: 0 0 5px rgba(255,70,85,0.2); }
            100% { text-shadow: 0 0 20px rgba(255,70,85,0.7); }
        }

        h1 span { color: #ff4655; }

        p { 
            color: #8393a7; 
            font-size: 1.1rem; 
            max-width: 600px; 
            margin: 0 auto 35px auto; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Tarjetas de estado del servidor/sistema estilo Valorant */
        .status-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .status-card {
            background: #1f2326;
            border-left: 3px solid #ff4655;
            padding: 15px 25px;
            width: 220px;
            text-align: left;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .status-title {
            font-size: 0.75rem;
            color: #8393a7;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .status-value {
            font-family: 'Teko', sans-serif;
            font-size: 1.6rem;
            color: #ece8e1;
            letter-spacing: 1px;
        }

        .online-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            margin-right: 5px;
            animation: blinkDot 1s infinite alternate;
        }

        @keyframes blinkDot {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        .btn-main {
            display: inline-block;
            background: transparent;
            color: #ece8e1;
            border: 2px solid #ff4655;
            padding: 14px 35px;
            font-family: 'Teko', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            position: relative;
            overflow: hidden;
        }

        .btn-main:hover {
            background: #ff4655;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 70, 85, 0.8);
            transform: scale(1.05);
        }

        .btn-main:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <nav>
        <a href="index.html" class="active">Cuartel General</a>
        <a href="valorant.html">Meta & Agentes</a>
        <a href="contacto.html">Reclutamiento / Clips</a>
    </nav>

    <div class="container">
        <!-- Spike Animado Decorativo de Valorant -->
        <div class="spike-container">
            <div class="spike-aura"></div>
            <svg class="spike-icon" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#ff4655" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <polygon points="12,12 16,9 12,6 8,9" fill="#ff4655"/>
            </svg>
        </div>

        <h1>RED TÁCTICA <span>NEXUS</span></h1>
        <p>Centro de operaciones principal para la élite de jugadores y estrategas.</p>

        <!-- Tarjetas de estado del sistema estilo Valorant -->
        <div class="status-grid">
            <div class="status-card">
                <span class="status-title">Estado de Red</span>
                <div class="status-value"><span class="online-dot"></span>ONLINE / 128 TICK</div>
            </div>
            <div class="status-card">
                <span class="status-title">Protocolo Activo</span>
                <div class="status-value">FASE // 06</div>
            </div>
        </div>

        <a href="valorant.html" class="btn-main">Ver Protocolo de Agentes</a>
    </div>

</body>
</html>
