<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Virtual</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
        header { background-color: #343a40; color: white; padding: 20px; text-align: center; }
        .container { display: flex; justify-content: center; gap: 20px; padding: 40px; flex-wrap: wrap; }
        .producto { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; padding: 20px; text-align: center; }
        .producto h3 { margin-top: 0; color: #007bff; }
        .precio { font-size: 18px; font-weight: bold; color: #28a745; margin: 15px 0; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; width: 100%; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <header>
        <h1>Mi Tienda en la Nube</h1>
        <p>Los mejores productos a un solo clic</p>
    </header>

    <div class="container">
        <div class="producto">
            <h3>Camiseta Gamer</h3>
            <p class="precio">$25.00 USD</p>
            <button onclick="alert('¡Has comprado la Camiseta Gamer!')">Comprar Ahora</button>
        </div>

        <div class="producto">
            <h3>Gorra Estilo Urbano</h3>
            <p class="precio">$15.00 USD</p>
            <button onclick="alert('¡Has comprado la Gorra Urbana!')">Comprar Ahora</button>
        </div>

        <div class="producto">
            <h3>Taza de Programador</h3>
            <p class="precio">$12.00 USD</p>
            <button onclick="alert('¡Has comprado la Taza de Programador!')">Comprar Ahora</button>
        </div>
    </div>

</body>
</html>
